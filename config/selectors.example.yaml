# Copy this to config/selectors.yaml. Every selector below was captured from
# a real run of scripts/discover_form.py against app.indiapost.gov.in
# (Keycloak login + segmented TOTP 2FA + CRM last-event report). Re-run that
# script and update this file if the portal's UI changes.
#
# Each step is executed in order by src/browser.py. Supported actions:
#   fill               - type text into an input
#   fill_totp          - generate the current 6-digit TOTP code and type it
#                        into a single input (unused here, kept for other
#                        sites with a one-box OTP field)
#   fill_totp_digits   - generate the current 6-digit TOTP code and type one
#                        digit into each element matched by selector, in
#                        order (used here — this portal has 6 separate
#                        single-digit boxes)
#   select             - choose an option from a <select> (by visible label,
#                        falls back to value if no label match)
#   click              - click an element
#   click_and_download - click and wait for a file download to start
#   wait_for_load      - wait for the page to finish navigating/loading
#   wait_for_selector  - wait until the given selector appears
#
# Dates (from_date/to_date) must be in YYYY-MM-DD format — the portal's
# StartDate/EndDate fields are native HTML date inputs.

steps:
  # --- Login (Keycloak) ------------------------------------------------------
  - name: username
    selector: "#username"
    action: fill
    value_from: username

  - name: password
    selector: "#password"
    action: fill
    value_from: password

  - name: login_button
    selector: "#kc-login"
    action: click

  - name: wait_after_login
    action: wait_for_load

  # --- 2FA: choose "Authenticator App (TOTP)" and continue --------------------
  - name: select_totp_method
    selector: "#totp"
    action: click

  - name: continue_after_method
    selector: "#kc-continue"
    action: click

  - name: wait_after_method
    action: wait_for_load

  # --- 2FA: enter the 6-digit code --------------------------------------------
  # This screen uses 6 separate single-digit text boxes (no id/name on them)
  # with a hidden #totp field the site's own JS keeps in sync as you type.
  - name: otp_code
    selector: "input[type='text']"
    action: fill_totp_digits
    value_from: totp_secret

  - name: submit_otp
    selector: "#kc-submit"
    action: click

  - name: wait_after_otp
    action: wait_for_load

  # The SPA takes a while to render the report form after the OAuth
  # redirect back from Keycloak — wait for the actual field rather than
  # assuming "load" means the form is ready.
  - name: wait_for_report_form
    action: wait_for_selector
    selector: "#StartDate"

  # --- Report filter screen ---------------------------------------------------
  - name: from_date
    selector: "#StartDate"
    action: fill
    value_from: from_date

  - name: to_date
    selector: "#EndDate"
    action: fill
    value_from: to_date

  - name: customer_id
    selector: "#CustomerID"
    action: fill
    value_from: customer_id

  - name: submit
    selector: "text=Submit >> nth=0"
    action: click

  - name: wait_for_results
    action: wait_for_selector
    selector: "text=Download CSV"

  # There are two "Download CSV" buttons on this page (one submit + one
  # duplicate/toggle) — target the first explicitly to avoid Playwright's
  # strict-mode "multiple elements match" error.
  - name: download
    selector: "text=Download CSV >> nth=0"
    action: click_and_download
